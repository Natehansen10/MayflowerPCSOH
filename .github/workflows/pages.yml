# Publishes The Build File to GitHub Pages.
#
# GitHub Pages has two publishing modes, and this workflow handles both:
#
#   Settings -> Pages -> Build and deployment -> Source
#     "GitHub Actions"        this workflow builds, checks and publishes the site
#     "Deploy from a branch"  GitHub publishes the branch's files directly; this
#                             workflow still checks the content file on every
#                             push, and says so instead of failing
#
# Either way the site is at https://<owner>.github.io/<repo>/. Point
# tools/make-qr.py at that URL before printing the placards.
name: Deploy the Build File

on:
  push:
    branches:
      - claude/mayflower-brand-github-publish-q5wbuj
      - claude/park-city-showcase-strategy-qz34xa
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      # Fails the build rather than publishing a site whose content file is
      # broken — every page reads from content.js.
      - name: Check the content file parses
        run: |
          node -e "const fs=require('fs');
            const s=fs.readFileSync('assets/js/content.js','utf8');
            const r=eval(s+';({CONFIG,STATIONS})');
            if(!Array.isArray(r.STATIONS)||!r.STATIONS.length) throw new Error('no stations');
            r.STATIONS.forEach(function(x){
              ['slug','number','where','title','preview','lede','body'].forEach(function(k){
                if(!x[k]) throw new Error('station '+x.slug+' is missing '+k);
              });
            });
            console.log('content.js OK — '+r.STATIONS.length+' stations');"

      # Which mode is this repo in? "workflow" = GitHub Actions,
      # "legacy" = deploy from a branch, "none" = Pages is off.
      - id: mode
        name: Read the Pages publishing mode
        run: |
          bt=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
                    -H "Accept: application/vnd.github+json" \
                    "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" \
               | sed -n 's/.*"build_type"[ ]*:[ ]*"\([a-z]*\)".*/\1/p')
          mode="${bt:-none}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Pages publishing mode: $mode"

      - if: steps.mode.outputs.mode == 'workflow'
        uses: actions/configure-pages@v5

      - if: steps.mode.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Source = "GitHub Actions": publish what the build packaged.
  deploy:
    needs: build
    if: needs.build.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Source = "Deploy from a branch": GitHub is already publishing these files.
  # Nothing to do, and nothing wrong — say so rather than failing every push.
  branch-mode:
    needs: build
    if: needs.build.outputs.mode == 'legacy'
    runs-on: ubuntu-latest
    steps:
      - name: Published straight from the branch
        run: |
          echo "Pages is set to 'Deploy from a branch', so GitHub publishes"
          echo "these files itself. This run checked the content file and"
          echo "found it sound. Nothing further to do."
          echo
          echo "The site refreshes a minute or two after each push, at"
          echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo
          echo "Switching Source to 'GitHub Actions' would additionally block a"
          echo "publish whenever the content file fails the check above."

  # Pages is off entirely. One setting, and it can only be changed in a browser.
  explain:
    needs: build
    if: needs.build.outputs.mode == 'none'
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages is not switched on yet
        run: |
          echo "The site is sound but cannot be published yet."
          echo
          echo "Go to:  Settings -> Pages -> Build and deployment"
          echo "Set:    Source = GitHub Actions"
          echo
          echo "Then re-run this workflow from the Actions tab. No new commit"
          echo "is needed, and every later push publishes on its own."
          echo
          echo "If the repository is private, Pages also requires a plan that"
          echo "includes private Pages sites; making the repository public is"
          echo "the other way to get there."
          exit 1
