# Publishes The Build File to GitHub Pages on every push.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# After that the site is live at https://<user>.github.io/<repo>/ and this
# workflow keeps it current. Point tools/make-qr.py at that URL before printing.
name: Deploy the Build File

on:
  push:
    branches: ["claude/park-city-showcase-strategy-qz34xa"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
